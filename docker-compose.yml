
services:
  backend:
    image: "sen5e1/garderie-backend:latest"
    container_name: garderie-backend
    restart: unless-stopped
    environment:
      PORT: "4000"
      NODE_ENV: production
    ports:
      - "4000:4000"
    networks:
      - garderie-net
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    image: "sen5e1/garderie-frontend:latest"
    container_name: garderie-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      API_URL: http://backend:4000
    ports:
      - "3000:3000"
    networks:
      - garderie-net
    depends_on:
      backend:
        condition: service_healthy

networks:
  garderie-net:
    driver: bridge
